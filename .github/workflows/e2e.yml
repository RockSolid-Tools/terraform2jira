name: E2E Test
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear tfplan.json dummy
        run: |
          cat > tfplan.json <<'EOF'
          {
            "format_version": "1.2",
            "terraform_version": "1.9.0",
            "resource_changes": [
              {
                "address": "aws_s3_bucket.logs",
                "type": "aws_s3_bucket",
                "name": "logs",
                "change": { "actions": ["create"] }
              },
              {
                "address": "aws_iam_role.app",
                "type": "aws_iam_role",
                "name": "app",
                "change": { "actions": ["update"] }
              },
              {
                "address": "aws_instance.legacy",
                "type": "aws_instance",
                "name": "legacy",
                "change": { "actions": ["delete"] }
              },
              {
                "address": "aws_db_instance.main",
                "type": "aws_db_instance",
                "name": "main",
                "change": { "actions": ["delete", "create"] }
              },
              {
                "address": "aws_vpc.main",
                "type": "aws_vpc",
                "name": "main",
                "change": { "actions": ["no-op"] }
              }
            ]
          }
          EOF

      - name: Ejecutar la Action (referencia local)
        id: translate
        uses: ./
        with:
          plan_path: tfplan.json
          # api_url: https://terraform2jira-backend-git-feature-auth-analyze-rock-solid1.vercel.app/api/analyze

      - name: Ver plan reducido (debug)
        env:
          REDUCED_PLAN: ${{ steps.translate.outputs.reduced_plan }}
        run: echo "$REDUCED_PLAN" | jq .

