name: E2E Test
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Realistic, interrelated plan: a production data-tier upgrade (HA change recreates the
      # DB + its private endpoint in cascade), compute scale-up (cost), legacy decommission,
      # Key Vault lockdown (security), and adoption of existing infra (governance). LEAK_*
      # values across before/after exercise the DLP regression (names leave, values never do).
      - name: Crear tfplan.json realista
        run: |
          cat > tfplan.json <<'EOF'
          {
            "format_version": "1.2",
            "terraform_version": "1.9.0",
            "resource_changes": [
              {
                "address": "module.database.azurerm_postgresql_flexible_server.main",
                "module_address": "module.database",
                "type": "azurerm_postgresql_flexible_server",
                "name": "main",
                "action_reason": "replace_because_cannot_update",
                "change": {
                  "actions": ["delete", "create"],
                  "before": { "administrator_password": "LEAK_DB_OLD_P@ss123", "sku_name": "GP_Standard_D2s_v3", "high_availability": [{ "mode": "Disabled" }], "zone": "1" },
                  "after": { "administrator_password": "LEAK_DB_NEW_P@ss456", "sku_name": "GP_Standard_D4s_v3", "high_availability": [{ "mode": "ZoneRedundant" }], "zone": "2" },
                  "before_sensitive": { "administrator_password": true },
                  "after_sensitive": { "administrator_password": true },
                  "replace_paths": [["zone"]]
                }
              },
              {
                "address": "module.database.azurerm_private_endpoint.db",
                "module_address": "module.database",
                "type": "azurerm_private_endpoint",
                "name": "db",
                "action_reason": "replace_because_cannot_update",
                "change": {
                  "actions": ["delete", "create"],
                  "before": { "subnet_id": "/subscriptions/LEAK_SUB/subnets/legacy" },
                  "after": { "subnet_id": "/subscriptions/LEAK_SUB/subnets/data" },
                  "replace_paths": [["subnet_id"]]
                }
              },
              {
                "address": "module.database.azurerm_private_dns_a_record.db",
                "module_address": "module.database",
                "type": "azurerm_private_dns_a_record",
                "name": "db",
                "change": {
                  "actions": ["update"],
                  "before": { "records": ["10.0.1.4"] },
                  "after": { "records": ["10.0.2.4"] }
                }
              },
              {
                "address": "module.network.azurerm_subnet.data",
                "module_address": "module.network",
                "type": "azurerm_subnet",
                "name": "data",
                "change": {
                  "actions": ["update"],
                  "before": { "delegation": [] },
                  "after": { "delegation": [{ "name": "flexibleServers" }] }
                }
              },
              {
                "address": "module.network.azurerm_network_security_group.app",
                "module_address": "module.network",
                "type": "azurerm_network_security_group",
                "name": "app",
                "change": {
                  "actions": ["update"],
                  "before": { "security_rule": [{ "name": "https", "destination_port_range": "443", "source_address_prefix": "Internet" }] },
                  "after": { "security_rule": [{ "name": "https", "destination_port_range": "443", "source_address_prefix": "Internet" }, { "name": "ssh-admin", "destination_port_range": "22", "source_address_prefix": "LEAK_ADMIN_IP_203_0_113_7" }] }
                }
              },
              {
                "address": "module.app_service.azurerm_service_plan.main",
                "module_address": "module.app_service",
                "type": "azurerm_service_plan",
                "name": "main",
                "change": {
                  "actions": ["update"],
                  "before": { "sku_name": "P1v3" },
                  "after": { "sku_name": "P2v3" }
                }
              },
              {
                "address": "module.app_service.azurerm_linux_web_app.main",
                "module_address": "module.app_service",
                "type": "azurerm_linux_web_app",
                "name": "main",
                "change": {
                  "actions": ["update"],
                  "before": { "app_settings": { "DB_CONNECTION_STRING": "LEAK_conn_old" }, "site_config": [{ "always_on": true }] },
                  "after": { "app_settings": { "DB_CONNECTION_STRING": "LEAK_conn_new" }, "site_config": [{ "always_on": true, "health_check_path": "/health" }] },
                  "before_sensitive": { "app_settings": true },
                  "after_sensitive": { "app_settings": true }
                }
              },
              {
                "address": "module.functions.azurerm_linux_function_app.fn[\"orders\"]",
                "module_address": "module.functions",
                "type": "azurerm_linux_function_app",
                "name": "fn",
                "index": "orders",
                "change": {
                  "actions": ["update"],
                  "before": { "app_settings": { "QUEUE_CONNECTION": "LEAK_orders_old" } },
                  "after": { "app_settings": { "QUEUE_CONNECTION": "LEAK_orders_new" } },
                  "before_sensitive": { "app_settings": true },
                  "after_sensitive": { "app_settings": true }
                }
              },
              {
                "address": "module.functions.azurerm_linux_function_app.fn[\"payments\"]",
                "module_address": "module.functions",
                "type": "azurerm_linux_function_app",
                "name": "fn",
                "index": "payments",
                "change": {
                  "actions": ["update"],
                  "before": { "app_settings": { "STRIPE_KEY": "LEAK_payments_old" } },
                  "after": { "app_settings": { "STRIPE_KEY": "LEAK_payments_new" } },
                  "before_sensitive": { "app_settings": true },
                  "after_sensitive": { "app_settings": true }
                }
              },
              {
                "address": "module.functions.azurerm_linux_function_app.fn[\"notifications\"]",
                "module_address": "module.functions",
                "type": "azurerm_linux_function_app",
                "name": "fn",
                "index": "notifications",
                "change": {
                  "actions": ["update"],
                  "before": { "app_settings": { "SENDGRID_KEY": "LEAK_notif_old" } },
                  "after": { "app_settings": { "SENDGRID_KEY": "LEAK_notif_new" } },
                  "before_sensitive": { "app_settings": true },
                  "after_sensitive": { "app_settings": true }
                }
              },
              {
                "address": "module.functions.azurerm_linux_function_app.fn[\"legacy_sync\"]",
                "module_address": "module.functions",
                "type": "azurerm_linux_function_app",
                "name": "fn",
                "index": "legacy_sync",
                "action_reason": "delete_because_no_resource_config",
                "change": {
                  "actions": ["delete"],
                  "before": { "app_settings": { "LEGACY_API_KEY": "LEAK_legacy_sync" } },
                  "before_sensitive": { "app_settings": true }
                }
              },
              {
                "address": "module.keyvault.azurerm_key_vault.main",
                "module_address": "module.keyvault",
                "type": "azurerm_key_vault",
                "name": "main",
                "change": {
                  "actions": ["update"],
                  "before": { "public_network_access_enabled": true, "network_acls": [{ "default_action": "Allow" }] },
                  "after": { "public_network_access_enabled": false, "network_acls": [{ "default_action": "Deny" }] }
                }
              },
              {
                "address": "module.keyvault.azurerm_role_assignment.app_secrets",
                "module_address": "module.keyvault",
                "type": "azurerm_role_assignment",
                "name": "app_secrets",
                "change": { "actions": ["create"] }
              },
              {
                "address": "azurerm_storage_account.backups",
                "type": "azurerm_storage_account",
                "name": "backups",
                "change": { "actions": ["create"] }
              },
              {
                "address": "azurerm_linux_virtual_machine.legacy_jumpbox",
                "type": "azurerm_linux_virtual_machine",
                "name": "legacy_jumpbox",
                "action_reason": "delete_because_no_resource_config",
                "change": {
                  "actions": ["delete"],
                  "before": { "admin_password": "LEAK_JUMPBOX_PW", "size": "Standard_B2s" },
                  "before_sensitive": { "admin_password": true }
                }
              },
              {
                "address": "azurerm_container_registry.shared",
                "type": "azurerm_container_registry",
                "name": "shared",
                "change": {
                  "actions": ["no-op"],
                  "importing": { "id": "LEAK_IMPORT_ACR_ID" }
                }
              },
              {
                "address": "data.azurerm_client_config.current",
                "type": "azurerm_client_config",
                "name": "current",
                "change": { "actions": ["read"] }
              },
              {
                "address": "azurerm_resource_group.main",
                "type": "azurerm_resource_group",
                "name": "main",
                "change": { "actions": ["no-op"] }
              },
              {
                "address": "azurerm_log_analytics_workspace.monitoring",
                "type": "azurerm_log_analytics_workspace",
                "name": "monitoring",
                "change": {
                  "actions": ["update"],
                  "before": { "tags": { "Owner": "LEAK_TAG_alice" } },
                  "after": { "tags": { "Owner": "LEAK_TAG_bob" } }
                }
              },
              {
                "address": "azurerm_application_insights.app",
                "type": "azurerm_application_insights",
                "name": "app",
                "change": {
                  "actions": ["update"],
                  "before": { "tags": { "CostCenter": "LEAK_CC_1000", "Owner": "LEAK_TAG_alice" } },
                  "after": { "tags": { "CostCenter": "LEAK_CC_2000", "Owner": "LEAK_TAG_alice" } }
                }
              }
            ]
          }
          EOF

      - name: Ejecutar la Action (referencia local)
        id: translate
        uses: ./
        with:
          plan_path: tfplan.json
          relevant_tags: Environment,CostCenter
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          jira_base_url: https://terraform2jira.atlassian.net
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          jira_issue_key: CORE-1

      - name: Ver plan reducido (debug)
        env:
          REDUCED_PLAN: ${{ steps.translate.outputs.reduced_plan }}
        run: echo "$REDUCED_PLAN" | jq .
